<!doctype html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>રામાધણી એન્ટરપ્રાઇઝ</title>
    <link rel="stylesheet" href="./index.css" />
</head>

<body>
    <main class="homepage-root">
        <!-- Left Section: Logo & Brand -->
        <section class="brand-section">
            <div class="logo-placeholder" aria-label="Logo placeholder">
                <svg class="logo-svg" viewBox="0 0 140 140" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Maa Ashapura Trading logo">
    <defs>
        <!-- Gradient for background -->
        <linearGradient id="brandGradient" x1="0" x2="1" y1="0" y2="1">
            <stop offset="0%" stop-color="#8B5A3C" />
            <stop offset="100%" stop-color="#D4A574" />
        </linearGradient>

        <!-- Circular clip path for PNG -->
        <clipPath id="circleClip">
            <circle cx="70" cy="70" r="50" />
        </clipPath>
    </defs>

    <!-- Outer circle -->
    <circle cx="70" cy="70" r="65" fill="url(#brandGradient)" opacity="0.95" />

    <!-- Inner decorative circle -->
    <circle cx="70" cy="70" r="55" fill="none" stroke="#FFFFFF" stroke-width="2" opacity="0.7" />

    <!-- Circular PNG image in center -->
    <image 
        href="logo.jpg" 
        x="20" y="20" 
        width="100" height="100" 
        clip-path="url(#circleClip)" 
        preserveAspectRatio="xMidYMid slice" />

    <!-- (Optional) Center text over image -->
    <!-- <text x="70" y="120" font-size="12" fill="#FFFFFF" text-anchor="middle" font-weight="bold" opacity="0.8">મા</text> -->
</svg>

            </div>

            <div class="brand-info">
                <h1 class="company-name">રામાધણી એન્ટરપ્રાઇઝ
                </h1>

                <div class="contact-details">
                    <div class="contact-item">
                        <span class="contact-label">ફોન:</span>
                        <span class="contact-value">9687276849</span>
                    </div>
                    <div class="contact-item">
                        <span class="contact-label">માલિક:</span>
                        <span class="contact-value">રઘુવીરસિંહ ચૌહાણ</span>
                    </div>
                </div>

                <div class="divider"></div>

                <p class="description">સુવ્યવસ્થિત કૃષિ બિલિંગ અને ખેતર વ્યવસ્થાપન ઉકેલો કાર્યક્ષમ પાક વર્તમાન અને આર્થિક ટ્રેકિંગ માટે.</p>
            </div>
        </section>

        <!-- Right Section: Actions -->
        <section class="action-section">
            <div class="action-header">
                <h2>ઝડપી પહોંચ</h2>
            </div>

            <nav class="action-buttons">
                <button class="btn btn-primary" id="farmersBtn" aria-label="Add Farmers">
                    <span class="btn-icon">📋</span>
                    <span class="btn-text">કિસાનો જુઓ</span>
                </button>
                <button class="btn btn-secondary" id="sellTogetherBtn" aria-label="View Listing">
                    <span class="btn-icon">📊</span>
                    <span class="btn-text">એક સાથે વેચો</span>
                </button>
            </nav>

            <div class="footer-note">
                <p>આવૃત્તિ 1.0 • કૃષિ વર્તમાન વ્યવસ્થાપન સિસ્ટમ</p>
            </div>
        </section>
    </main>

    <script>
        document.addEventListener("DOMContentLoaded", () => {
            document.body.style.opacity = "0"
            setTimeout(() => {
                document.body.style.opacity = "1"
            }, 10)
        })
        const {
            ipcRenderer
        } = require('electron');
        // Use absolute paths to the renderer entry HTML names produced by the webpack plugin.
        // In dev mode the dev server serves pages at e.g. /add_bill.html and /view_bill.html
        document.getElementById('farmersBtn').addEventListener('click', () => {
            ipcRenderer.send('navigate', 'viewFarmers.html');
        });
        document.getElementById('sellTogetherBtn').addEventListener('click', () => {
            ipcRenderer.send('navigate', 'sellTogetherList.html');
        });
    </script>
</body>

</html>
